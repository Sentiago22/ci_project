jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.7.9', '3.8', '3.9']  # Sử dụng phiên bản cụ thể như '3.7.9'

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: ${{ matrix.python-version }}  # Cập nhật với phiên bản cụ thể

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run flake8
        run: |
          flake8 .

      - name: Run tests
        run: |
          pytest

      - name: Send Telegram Notification on Failure
        if: failure()
        uses: appleboy/telegram-action@v0.0.8
        with:
          token: ${{ secrets.TELEGRAM_TOKEN }}
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          message: 'Tests failed in GitHub Actions for your project!'
